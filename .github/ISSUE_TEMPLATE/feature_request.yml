name: Feature request
description: Suggest an automation scenario, framework improvement, or workflow change.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be added or improved?
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Value
      description: Why is this useful for the project?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Given ...
        - When ...
        - Then ...
    validations:
      required: false
